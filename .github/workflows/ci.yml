name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Install, train & test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Initialize database & train model
        run: |
          python database/init_db.py
          python ai-ml/train_model.py

      - name: Run end-to-end test suite
        run: python tests/run_all_tests.py

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit backend requirements (advisory)
        continue-on-error: true
        run: pip-audit -r backend/requirements.txt

  docker:
    name: Build container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -f deploy/Dockerfile -t agrismoke-ai:ci .
