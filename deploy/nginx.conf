# ==============================================================================
# AgriSmoke AI - Production nginx (self-hosted / VPS path)
# On Render this file is NOT used (Render terminates TLS itself). For a VPS,
# replace agrismoke.example.com with your domain and point the cert paths at
# Let's Encrypt certificates (e.g. via certbot). HTTP is redirected to HTTPS.
# ==============================================================================

# Redirect all plain-HTTP traffic to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name agrismoke.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name agrismoke.example.com;

    # --- TLS (replace with your real cert paths; certbot uses /etc/letsencrypt/live) ---
    ssl_certificate     /etc/letsencrypt/live/agrismoke.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agrismoke.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Baseline transport security (app also sets HSTS; keep consistent).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Do not advertise nginx version.
    server_tokens off;

    # Sensible body size cap and timeouts.
    client_max_body_size 1m;

    # Gzip text assets.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Everything is served by the FastAPI app (frontend + API + WebSocket).
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Real-time telemetry WebSocket stream.
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # API + health.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # NOTE: /docs is intentionally not proxied here, keeping the API surface
    # private on a public VPS. Enable it only behind authentication if needed.
}
