# ==============================================================================
# AgriSmoke AI - Render Blueprint (FREE / STATELESS PUBLIC DEPLOYMENT)
# Docs: https://render.com/docs/blueprint-spec  ·  https://render.com/docs/free
#
# This deployment is a genuinely PUBLIC, READ-ONLY website on the Render FREE
# compute plan. There are no accounts, no logins and NO persistent storage.
# The architecture is deliberately stateless:
#
#   Visitors -> Render Free web service -> FastAPI + Vanilla JS frontend
#            -> SQLite on the container's EPHEMERAL disk (recreated + seeded at
#               every boot by backend/database.py::ensure_ready())
#            -> NASA FIRMS + Open-Meteo fetched ON DEMAND (short-lived cache)
#            -> CSV/PDF reports generated in memory / client-side, never stored
#
# WHY FREE WORKS HERE (and its hard limits, from Render's free-tier docs):
#   * Free compute = 0.1 CPU / 512 MB RAM, a single instance, NO persistent disk.
#   * Free services SPIN DOWN after 15 min idle; the next request cold-starts in
#     ~1 min (Render shows a loading page). Any runtime file writes are LOST on
#     spin-down/restart - which is fine because the DB is reference-seeded at boot.
#   * 750 free instance-hours/month; spun-down time does NOT count.
#   * Render may suspend a free service that generates a HIGH volume of
#     service-initiated (outbound) API traffic - so background schedulers are OFF
#     and live data uses a traffic-independent, single-flight cached fetch.
#
# NOTE: The persistent-disk + paid-plan production setup is preserved for future
# use in deploy/Dockerfile (Docker runtime). This blueprint intentionally does
# NOT use Docker, because Render's Free tier is verified for native Python runtimes.
# ==============================================================================

services:
  - type: web
    name: agrismoke-ai
    runtime: python                   # native Python buildpack (free-compatible)
    plan: free                        # genuinely free tier; no paid instance
    region: oregon                    # change to your nearest Render region

    # Install deps AND train the ML model during the (cached) build step, because
    # the model artifacts (*.joblib) are git-ignored and must exist before serving.
    # Doing it here - not at request time - keeps cold starts light on 512 MB RAM.
    buildCommand: pip install -r backend/requirements.txt && python ai-ml/train_model.py

    # Single process (no --workers / --reload): exactly one scheduler instance,
    # and schedulers are disabled below anyway. Binds 0.0.0.0:$PORT (Render sets PORT).
    startCommand: python backend/run.py
    healthCheckPath: /api/health

    envVars:
      - key: PYTHON_VERSION
        value: "3.13"

      # ---- Security posture (production defaults, restated for defense-in-depth) ----
      - key: ENVIRONMENT
        value: production             # read-only + docs off + HSTS + rate limit by default
      - key: READ_ONLY
        value: "true"                 # block all public write endpoints (no DB mutations)
      - key: DOCS_ENABLED
        value: "false"                # do not expose the API surface publicly

      # ---- Stateless storage ----
      # SQLite lives on the container's ephemeral filesystem. It is created,
      # schema-applied, WAL-enabled and reference-SEEDED automatically at startup
      # by ensure_ready(); nothing user-generated is ever persisted. /tmp is
      # guaranteed writable. NO persistent disk is configured (free tier cannot).
      - key: DB_PATH
        value: /tmp/agri_smoke.db

      # ---- No background jobs ----
      # Free tier throttles service-initiated traffic; retention/backup are
      # meaningless on an ephemeral disk. Ingestion is replaced by on-demand fetch.
      - key: SCHEDULER_ENABLED
        value: "false"
      - key: MAINTENANCE_ENABLED
        value: "false"

      # ---- Live fire data WITHOUT a scheduler (decision #7) ----
      # Fetches NASA FIRMS on the read path into a short-lived, single-flight
      # in-memory cache (no DB writes). The number of NASA calls is bounded by the
      # TTL, NOT by visitor traffic, so it stays well within free-tier limits. If
      # the MAP key is unset or the provider errors, endpoints fall back to the
      # seeded reference data. Safe default enabled here; the code default is off.
      - key: FIRMS_ON_DEMAND
        value: "true"
      - key: FIRMS_ON_DEMAND_TTL_SECONDS
        value: "900"                  # 15 min => at most ~96 NASA fetches/day

      # Optional. A free NASA Earthdata MAP_KEY enables the live fire layer; if it
      # is left blank the site still works, showing clearly-fallback reference data.
      # `sync: false` is Render's Blueprint field to prompt for a secret value in the
      # dashboard at creation without hardcoding it (https://render.com/docs/blueprint-spec).
      - key: NASA_FIRMS_MAP_KEY
        sync: false                   # prompted once in the Render dashboard; never stored in git

      # Same-origin: the frontend is served by this same app, so no CORS needed.
      - key: CORS_ORIGINS
        value: ""
