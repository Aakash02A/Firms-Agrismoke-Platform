<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400" role="img" aria-label="AgriSmoke AI banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0e2233"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="plume" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3d00" stop-opacity="0.85"/>
      <stop offset="0.5" stop-color="#ff9100" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4a148c" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="aqi" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00e676"/>
      <stop offset="0.25" stop-color="#aeea00"/>
      <stop offset="0.5" stop-color="#ffd600"/>
      <stop offset="0.7" stop-color="#ff9100"/>
      <stop offset="0.85" stop-color="#ff3d00"/>
      <stop offset="1" stop-color="#4a148c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22c55e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22c55e" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="400" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 100 H1600 M0 200 H1600 M0 300 H1600"/>
    <path d="M200 0 V400 M400 0 V400 M600 0 V400 M800 0 V400 M1000 0 V400 M1200 0 V400 M1400 0 V400"/>
  </g>

  <!-- ambient glow -->
  <circle cx="1180" cy="150" r="260" fill="url(#glow)"/>

  <!-- smoke plume path from fields (left) to city (right) -->
  <path d="M250 250 C520 150, 760 300, 1120 190" fill="none" stroke="url(#plume)" stroke-width="46" stroke-linecap="round" opacity="0.55"/>
  <path d="M250 250 C520 150, 760 300, 1120 190" fill="none" stroke="url(#plume)" stroke-width="10" stroke-linecap="round" opacity="0.9"/>

  <!-- agricultural fire hotspots -->
  <g>
    <circle cx="210" cy="255" r="9" fill="#ff3d00"/><circle cx="210" cy="255" r="16" fill="#ff3d00" opacity="0.25"/>
    <circle cx="300" cy="238" r="7" fill="#ff5a1f"/><circle cx="300" cy="238" r="13" fill="#ff5a1f" opacity="0.22"/>
    <circle cx="360" cy="272" r="6" fill="#ff3d00"/><circle cx="360" cy="272" r="12" fill="#ff3d00" opacity="0.2"/>
    <circle cx="270" cy="288" r="5" fill="#ff7043"/>
    <circle cx="420" cy="250" r="5" fill="#ff7043"/>
  </g>

  <!-- destination city marker (Delhi-NCR) -->
  <g transform="translate(1120,190)">
    <circle r="30" fill="#22c55e" opacity="0.18"/>
    <circle r="18" fill="#0b1220" stroke="#22c55e" stroke-width="3"/>
    <circle r="7" fill="#22c55e"/>
    <text x="40" y="6" fill="#e2e8f0" font-family="'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="600">Delhi-NCR</text>
  </g>

  <!-- title -->
  <text x="120" y="150" fill="#ffffff" font-family="'Segoe UI', system-ui, sans-serif" font-size="78" font-weight="800" letter-spacing="1">AgriSmoke AI</text>
  <text x="124" y="196" fill="#a7f3d0" font-family="'Segoe UI', system-ui, sans-serif" font-size="26" font-weight="500">Crop-Burning Smoke Transport &amp; Urban Air Quality Prediction</text>
  <text x="124" y="230" fill="#94a3b8" font-family="'Segoe UI', system-ui, sans-serif" font-size="20">Live NASA FIRMS + Open-Meteo &#183; Indo-Gangetic Airshed &#183; GRAP Advisory</text>

  <!-- AQI gradient scale -->
  <g transform="translate(124,300)">
    <rect x="0" y="0" width="1352" height="10" rx="5" fill="url(#aqi)"/>
    <text x="0" y="34" fill="#cbd5e1" font-family="'Segoe UI', system-ui, sans-serif" font-size="16">AQI 0 &#183; Good</text>
    <text x="1352" y="34" fill="#cbd5e1" font-family="'Segoe UI', system-ui, sans-serif" font-size="16" text-anchor="end">999+ &#183; Severe / Emergency</text>
  </g>
</svg>
